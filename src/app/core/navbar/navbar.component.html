<header class="navbar-wrapper" [class.scrolled]="isScrolled">
  <div class="navbar-container">
    <!-- Brand / Logo -->
    <a routerLink="/portfolio" (click)="closeMobileMenu()" class="brand-link" title="Fellah A - Home">
      <div class="brand-avatar">
        <img [src]="personalInfo.photoUrl" alt="Fellah A" />
      </div>
      <span class="brand-name">FELLAH<span class="brand-accent">.A</span></span>
    </a>

    <!-- Desktop Nav Links -->
    <nav class="desktop-nav">
      @for (link of navLinks; track link.path) {
        <a 
          [routerLink]="link.path" 
          routerLinkActive="active" 
          [routerLinkActiveOptions]="{ exact: link.exact }"
          class="nav-item">
          {{ link.label }}
        </a>
      }
    </nav>

    <!-- Right Actions -->
    <div class="nav-actions">
      <a [href]="personalInfo.resumeUrl" download="Fellah_A_Resume.pdf" class="btn-resume" title="Download Resume">
        <svg class="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Download Resume</span>
      </a>

      <!-- Mobile Hamburger Button -->
      <button 
        (click)="toggleMobileMenu()" 
        class="btn-hamburger" 
        [class.open]="mobileMenuOpen" 
        aria-label="Toggle Navigation">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>
  </div>

  <!-- Mobile Drawer Menu -->
  @if (mobileMenuOpen) {
    <div class="mobile-drawer">
      <nav class="mobile-nav-list">
        @for (link of navLinks; track link.path) {
          <a 
            [routerLink]="link.path" 
            routerLinkActive="active" 
            [routerLinkActiveOptions]="{ exact: link.exact }"
            (click)="closeMobileMenu()"
            class="mobile-nav-item">
            {{ link.label }}
          </a>
        }
        <a 
          [href]="personalInfo.resumeUrl" 
          download="Fellah_A_Resume.pdf" 
          class="mobile-resume-btn"
          (click)="closeMobileMenu()">
          <svg class="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Download Resume</span>
        </a>
      </nav>
    </div>
  }
</header>
